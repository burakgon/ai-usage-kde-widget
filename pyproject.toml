[project]
name = "ai-usage-kde"
version = "0.1.0"
description = "Native KDE Plasma 6 widget showing Claude Code and Codex subscription usage"
requires-python = ">=3.11"
# PySide6 is provided by the system package (pacman), intentionally NOT a pip dep.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ai-usage-kde = "ai_usage_kde.cli:print_json"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
